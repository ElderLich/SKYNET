name: WindBot, SKYNET and Arena validation
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Validate main · run {0}', github.run_number) }}"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dialogs:
    name: macOS Solo dialog reader
    runs-on: macos-15
    outputs:
      check_id: ${{ job.check_run_id }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Load shipped dialogs with the Unity reader
        shell: pwsh
        run: ./WindBot/Tools/Test-UnityDialogs.ps1
  windows:
    runs-on: windows-2022
    outputs:
      check_id: ${{ job.check_run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - name: Build WindBot Debug
        run: msbuild WindBot/WindBot.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU"
      - name: Build WindBot Release
        run: msbuild WindBot/WindBot.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"
      - name: Check WindBot executor layout and tools
        run: python WindBot/Tools/test_bot_tool.py
      - name: Check every Solo roster and the MDPro4 sync
        run: python -m unittest discover -s WindBot/Tools/Sync -p "test_*.py"
      - name: Build SKYNET Debug
        run: msbuild SKYNET/Skynet.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU"
      - name: Build SKYNET Release
        run: msbuild SKYNET/Skynet.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"
      - name: Validate learning tools
        run: python SKYNET/Tools/Skynet/test_learning.py
      - name: Validate bounded research inspector
        run: python SKYNET/Tools/Skynet/test_ygo_agent_inspection.py
      - name: Validate public-observation shadow mapping
        run: python SKYNET/Tools/Skynet/test_ygo_agent_shadow.py
      - name: Validate card-selection demonstration audits
        run: python SKYNET/Tools/Skynet/test_demonstrations.py
      - name: Validate owned Arena process cleanup
        run: python Arena/Tools/test_arena_process_owner.py
      - name: Stage explicit product payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Artifacts/package/Data -Force | Out-Null
          ./SKYNET/Tools/Skynet/Install-MDPro4.ps1 -GameRoot Artifacts/package -Configuration Release
      - uses: actions/upload-artifact@v6
        with:
          name: SKYNET-windows
          path: Artifacts/package/Data/Skynet/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: WindBot-windows
          path: |
            WindBot/bin/Release/
            WindBot/BotWrapper/bin/Release/
            WindBot/LICENSE
            WindBot/README.md
            WindBot/resource-provenance.json
          if-no-files-found: error
  arena:
    runs-on: windows-2022
    outputs:
      check_id: ${{ job.check_run_id }}
    defaults:
      run:
        working-directory: Arena
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Arena/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  mono:
    runs-on: ubuntu-latest
    outputs:
      check_id: ${{ job.check_run_id }}
    container:
      image: mono:6.8.0.123
    steps:
      - uses: actions/checkout@v6
      - name: Build SKYNET with legacy Mono
        run: msbuild SKYNET/Skynet.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"
      - name: Build WindBot with legacy Mono
        run: msbuild WindBot/WindBot.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"

  report:
    name: Validation report
    if: always()
    needs: [windows, arena, mono, dialogs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Summarize checks and link their logs
        shell: python
        env:
          CHECKS: ${{ toJSON(needs) }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json
          import os

          checks = json.loads(os.environ["CHECKS"])
          repo = os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"]
          run = repo + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          revision = os.environ["REVISION"]
          labels = {
              "windows": "Windows builds, offline tests and release packages",
              "arena": "Arena tests and dashboard build",
              "mono": "WindBot and SKYNET on legacy Mono",
              "dialogs": "Solo dialog reader on macOS",
          }
          status = {"success": "✅ Passed", "failure": "❌ Failed",
                    "cancelled": "⛔ Cancelled", "skipped": "⏭️ Skipped"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(f"Revision [{revision[:8]}]({repo}/commit/{revision})", file=summary)
              tested = os.environ["GITHUB_SHA"]
              if tested != revision:
                  print(f" · Tested merge [{tested[:8]}]({repo}/commit/{tested})", file=summary)
              print("\n| Check | Result |\n| --- | --- |", file=summary)
              for key, check in checks.items():
                  job_id = check["outputs"].get("check_id")
                  url = f"{run}/job/{job_id}" if job_id else run
                  result = check["result"]
                  print(f"| [{labels.get(key, key)}]({url}) | {status.get(result, result)} |", file=summary)
          if any(check["result"] != "success" for check in checks.values()):
              raise SystemExit("Validation is incomplete. Open the affected check in the report.")
